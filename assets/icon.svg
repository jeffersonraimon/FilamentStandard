<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>FilamentStandard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ccfb6"/>
      <stop offset=".55" stop-color="#009688"/>
      <stop offset="1" stop-color="#00574e"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <!-- three spools in the standard order: white, black, colour -->
  <g transform="translate(232 400)"><circle r="122" fill="#ffffff" fill-opacity=".18" stroke="#fff" stroke-width="12"/><circle r="96" fill="#ffffff"/><circle r="96" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="4"/><circle r="36" fill="#e0f2f1" stroke="#fff" stroke-width="8"/><circle r="15" fill="#00695c"/></g>
  <g transform="translate(512 400)"><circle r="122" fill="#ffffff" fill-opacity=".18" stroke="#fff" stroke-width="12"/><circle r="96" fill="#1b1f23"/><circle r="36" fill="#e0f2f1" stroke="#fff" stroke-width="8"/><circle r="15" fill="#00695c"/></g>
  <g transform="translate(792 400)"><circle r="122" fill="#ffffff" fill-opacity=".18" stroke="#fff" stroke-width="12"/><circle r="96" fill="#ff8a1f"/><circle r="96" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="4"/><circle r="36" fill="#e0f2f1" stroke="#fff" stroke-width="8"/><circle r="15" fill="#00695c"/></g>
  <!-- slot numbers -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="64" text-anchor="middle" fill="#00796b">
    <rect x="182" y="574" width="100" height="84" rx="22" fill="#fff"/><text x="232" y="639">1</text>
    <rect x="462" y="574" width="100" height="84" rx="22" fill="#fff"/><text x="512" y="639">2</text>
    <rect x="742" y="574" width="100" height="84" rx="22" fill="#fff"/><text x="792" y="639">3</text>
  </g>
  <!-- the standard rail with a restore arrow -->
  <path d="M182 752 H842" stroke="#fff" stroke-width="22" stroke-linecap="round" opacity=".9"/>
  <path d="M856 752 l-62 -42 v84 z" fill="#fff" opacity=".9"/>
</svg>
