name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Plugin file compiles
        run: python -m py_compile filament_standard.py

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the plugin version
        run: |
          version=$(grep -oP '^VERSION = "\K[^"]+' filament_standard.py)
          test "v$version" = "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: filament_standard.py
          generate_release_notes: true
