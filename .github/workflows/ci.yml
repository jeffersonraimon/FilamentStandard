name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Plugin file compiles
        run: python -m py_compile filament_standard.py

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Orca Cloud authenticates the upload with GitHub OIDC (no secrets)
    env:
      # Orca Cloud requires a target suffix in the file name; "any" = every OS and architecture.
      PLUGIN_FILES: "dist/filament_standard_any.py"
    steps:
      - uses: actions/checkout@v4

      - name: Build release files and notes
        run: python scripts/build_release.py "${GITHUB_REF_NAME}"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: FilamentStandard ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/filament_standard_any.py
            dist/filament_standard.py

      # Turned on by the repository variable ORCACLOUD_PUBLISH=true once the repository is connected
      # to the plugin on Orca Cloud (Shared Plugins > Edit plugin > GitHub publishing).
      # Same request as Orca Cloud's publish-orcacloud.yml template; it lives here because a release
      # created with GITHUB_TOKEN does not trigger other "release: published" workflows.
      - name: Publish to Orca Cloud
        if: vars.ORCACLOUD_PUBLISH == 'true'
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(head -c 4000 dist/notes.md)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
