name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Plugin file compiles
        run: python -m py_compile filament_standard.py
      - name: Release files build
        shell: bash
        run: python scripts/build_release.py "v$(python -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('filament_standard.py', encoding='utf-8').read(), re.M).group(1))")"
